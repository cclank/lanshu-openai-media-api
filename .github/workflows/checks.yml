name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python: ["3.9", "3.11", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Run offline protocol tests
        run: python -B -m unittest discover -s scripts -p 'test_*.py' -v
      - name: Check documentation and repository structure
        run: python -B tools/check_docs.py
      - name: Build portable skill
        run: python -B tools/build_skill.py --output-dir dist
      - name: Install CLI
        run: python -m pip install --no-deps .
      - name: Check installed entry point
        run: lanshu-openai-media-api models
