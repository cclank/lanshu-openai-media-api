[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lanshu-openai-media-api"
version = "0.2.0"
description = "OpenAI text/image generation, audio transcription, and usage records for agents."
readme = "README.md"
requires-python = ">=3.9"
license = {file = "LICENSE"}
authors = [{name = "Lanshu"}]
dependencies = []
keywords = ["openai", "text-generation", "responses-api", "images", "speech-to-text", "asr", "agent-skills"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Multimedia :: Graphics",
  "Topic :: Multimedia :: Sound/Audio :: Speech",
]

[project.urls]
Repository = "https://github.com/cclank/lanshu-openai-media-api"
Issues = "https://github.com/cclank/lanshu-openai-media-api/issues"

[project.scripts]
lanshu-openai-media-api = "openai_media:main"

[tool.setuptools]
py-modules = ["openai_media"]
package-dir = {"" = "scripts"}
